name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: App bundle
        run: make app && codesign -dv build/kaju.app 2>&1 | grep "Identifier=io.github.aigeano.kaju"
